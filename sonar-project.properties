sonar.projectKey=lanna
sonar.projectName=Lanna
sonar.sourceEncoding=UTF-8

sonar.sources=lib
sonar.tests=test,integration_test
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,lib/l10n/app_localizations*.dart

sonar.dart.analyzer.mode=MANUAL
sonar.dart.analyzer.report.mode=MACHINE
sonar.dart.analyzer.report.path=build/sonar/analysis.txt
sonar.flutter.coverage.reportPath=build/sonar/lcov.info
sonar.flutter.tests.reportPath=build/sonar/tests.output
