<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #121116; }
    #viewer { position: absolute; top: 52px; right: 0; bottom: 44px; left: 0; }
    .tap {
      position: absolute; top: 52px; bottom: 44px; width: 110px; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      color: #e9e4da; -webkit-tap-highlight-color: transparent; cursor: pointer;
    }
    #tap-prev { left: 0; }
    #tap-next { right: 0; background: linear-gradient(90deg, transparent, rgba(0,0,0,.22)); }
    .tap svg { opacity: .2; transition: opacity .15s; }
    .tap:hover svg { opacity: .45; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <div id="tap-prev" class="tap">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div id="tap-next" class="tap">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <script src="jszip.min.js"></script>
  <script src="epub.min.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var opf = params.get('opf');
      var book = opf ? ePub('book/' + opf) : ePub('book/');
      var hasCachedLocations = params.get('loc') === '1';
      var rendition = book.renderTo('viewer', {
        width: '100%',
        height: '100%',
        flow: 'paginated',
        spread: 'auto',
        minSpreadWidth: 820,
        allowScriptedContent: false
      });

      var theme = { bg: '#121116', fg: '#d4cec1', link: '#e8968d', fontSizePct: 112, fontFamily: 'serif', lineHeight: 1.6 };
      var columnsMode = 'auto';
      var edgeTapsEnabled = true;
      var pageAnimation = 'slide';
      var locationsReady = false;

      function applyEdgeTaps() {
        var display = edgeTapsEnabled ? 'flex' : 'none';
        var prev = document.getElementById('tap-prev');
        var next = document.getElementById('tap-next');
        if (prev) prev.style.display = display;
        if (next) next.style.display = display;
      }

      function scrollHost() {
        return document.querySelector('#viewer .epub-container');
      }

      function applyPageAnimation() {
        var host = scrollHost();
        if (host) {
          host.style.scrollBehavior =
            (pageAnimation === 'slide' || pageAnimation === 'curl')
              ? 'smooth'
              : 'auto';
        }
        var viewer = document.getElementById('viewer');
        if (viewer && pageAnimation !== 'fade') {
          viewer.style.transition = '';
          viewer.style.opacity = '1';
        }
      }

      function beginPageTurn() {
        if (pageAnimation !== 'fade') return;
        var viewer = document.getElementById('viewer');
        if (!viewer) return;
        viewer.style.transition = 'opacity .12s ease';
        viewer.style.opacity = '0.25';
      }

      function endPageTurn() {
        var viewer = document.getElementById('viewer');
        if (viewer) viewer.style.opacity = '1';
      }

      function applyColumns() {
        if (columnsMode === 'single') rendition.spread('none', 999999);
        else if (columnsMode === 'double') rendition.spread('always', 0);
        else rendition.spread('auto', 720);
        try { rendition.resize(); } catch (e) {}
      }

      var resizeT;
      window.addEventListener('resize', function () {
        clearTimeout(resizeT);
        resizeT = setTimeout(function () {
          try { rendition.resize(); } catch (e) {}
          if (columnsMode === 'auto') applyColumns();
        }, 150);
      });

      function sendToHost(obj) {
        var s = JSON.stringify(obj);
        try {
          if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
            window.flutter_inappwebview.callHandler('onReaderEvent', s);
            return;
          }
        } catch (e) {}
        try {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(s);
            return;
          }
        } catch (e) {}
        try { if (window.readerHost) window.readerHost.postMessage(s); } catch (e) {}
      }

      function applyTheme() {
        var fg = theme.fg + ' !important';
        var bg = theme.bg + ' !important';
        var colEm = theme.columnEm || 34;
        var colMax = 'min(' + colEm + 'em, 90vw)';
        var rules = {
          'html': { 'color': fg, 'background': bg },
          'body': {
            'color': fg,
            'background': bg,
            'line-height': String(theme.lineHeight || 1.7) + ' !important',
            'padding': '30px 0 !important',
            'text-align': (theme.justify === false ? 'left' : 'justify') + ' !important',
            'hyphens': 'auto',
            '-webkit-hyphens': 'auto'
          },
          'body *': { 'color': 'inherit !important' },
          'p, div, span, section, article, header, footer, main, aside, li, ul, ol, dl, dt, dd, blockquote, figure, figcaption, table, thead, tbody, tr, td, th, caption, h1, h2, h3, h4, h5, h6': {
            'background-color': 'transparent !important'
          },
          'p, li, blockquote, h1, h2, h3, h4, h5, h6, figure, dl, pre, table, hr': {
            'max-width': colMax + ' !important',
            'margin-left': 'auto !important',
            'margin-right': 'auto !important'
          },
          'img': { 'max-width': '100% !important', 'height': 'auto !important' },
          'a, a:link, a:visited, a *': {
            'color': (theme.link || theme.fg) + ' !important',
            'text-decoration': 'underline !important'
          }
        };
        if (theme.fontFamily) {
          rules['body']['font-family'] = theme.fontFamily + ' !important';
        }
        rendition.themes.register('lanna', rules);
        rendition.themes.select('lanna');
        rendition.themes.fontSize(theme.fontSizePct + '%');
        document.body.style.background = theme.bg;
      }

      var navBusy = false;
      function turn(dir) {
        if (navBusy) return;
        navBusy = true;
        beginPageTurn();
        var release = function () { navBusy = false; endPageTurn(); };
        var t = setTimeout(release, 1500);
        var p = dir > 0 ? rendition.next() : rendition.prev();
        Promise.resolve(p).catch(function () {}).then(function () {
          clearTimeout(t);
          release();
        });
      }

      function onNavKey(e) {
        var k = e.key;
        if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Spacebar') {
          e.preventDefault(); turn(1);
        } else if (k === 'ArrowLeft' || k === 'PageUp') {
          e.preventDefault(); turn(-1);
        }
      }

      document.addEventListener('keydown', onNavKey);
      rendition.hooks.content.register(function (contents) {
        contents.document.addEventListener('keydown', onNavKey);
      });

      function emitRelocated(location) {
        var pct = locationsReady
          ? book.locations.percentageFromCfi(location.start.cfi)
          : null;
        var payload = {
          type: 'relocated',
          cfi: location.start.cfi,
          href: location.start.href || null,
          percentage: pct,
          atStart: location.atStart === true,
          atEnd: location.atEnd === true
        };
        if (pct != null && book.locations.length) {
          var remainChars = (1 - pct) * book.locations.length * 1200;
          payload.remainingMinutes = Math.max(
            0, Math.round(remainChars / 5.5 / 255)
          );
        }
        try {
          var spineItem = book.spine.get(location.start.cfi);
          if (spineItem) {
            if (spineItem.index != null) payload.chapterIndex = spineItem.index;
            payload.href = spineItem.canonical || spineItem.href || payload.href;
          }
        } catch (e) {}
        sendToHost(payload);
      }

      rendition.on('relocated', emitRelocated);
      rendition.on('rendered', function () { sendToHost({ type: 'rendered' }); });

      function waitFor(getter, timeoutMs) {
        return new Promise(function (resolve) {
          var v = getter();
          if (v) return resolve(v);
          var elapsed = 0;
          var iv = setInterval(function () {
            v = getter();
            elapsed += 60;
            if (v || elapsed >= timeoutMs) { clearInterval(iv); resolve(v || null); }
          }, 60);
        });
      }

      function generateLocations() {
        return book.locations.generate(1200).then(function () {
          try {
            sendToHost({ type: 'locations', data: book.locations.save() });
          } catch (e) {}
        });
      }

      function setupLocations() {
        if (!hasCachedLocations) return generateLocations();
        return waitFor(function () { return window.__cachedLocations; }, 10000)
          .then(function (json) {
            if (json) {
              try { book.locations.load(json); return; } catch (e) {}
            }
            return generateLocations();
          });
      }

      book.ready
        .then(function () { return book.loaded.navigation; })
        .then(function (nav) {
          var toc = (nav.toc || []).map(function (item) {
            return { label: (item.label || '').trim(), href: item.href };
          });
          sendToHost({ type: 'toc', toc: toc });
          return setupLocations();
        })
        .then(function () {
          locationsReady = true;
          sendToHost({ type: 'locationsReady', total: book.locations.total });
          var loc = rendition.currentLocation();
          if (loc && loc.start) emitRelocated(loc);
        })
        .catch(function (err) {
          sendToHost({ type: 'error', message: String(err && err.message || err) });
        });

      document.getElementById('tap-next').addEventListener('click', function () { turn(1); });
      document.getElementById('tap-prev').addEventListener('click', function () { turn(-1); });

      window.readerApi = {
        next: function () { turn(1); },
        prev: function () { turn(-1); },
        display: function (target) { return rendition.display(target || undefined); },
        goToPercentage: function (p) {
          if (!locationsReady) return;
          var cfi = book.locations.cfiFromPercentage(Math.max(0, Math.min(1, p)));
          rendition.display(cfi);
        },
        loadLocations: function (json) {
          try { window.__cachedLocations = json; } catch (e) {}
        },
        search: function (query) {
          query = (query || '').trim();
          if (query.length < 2) {
            sendToHost({ type: 'searchResults', query: '', results: [] });
            return;
          }
          var results = [];
          var items = book.spine.spineItems.slice();
          var idx = 0;
          var limit = 200;
          function step() {
            if (idx >= items.length || results.length >= limit) {
              sendToHost({
                type: 'searchResults',
                query: query,
                results: results.slice(0, limit)
              });
              return;
            }
            var item = items[idx++];
            Promise.resolve(item.load(book.load.bind(book)))
              .then(function () {
                try {
                  var found = (typeof item.search === 'function'
                    ? item.search(query)
                    : item.find(query)) || [];
                  for (var i = 0; i < found.length; i++) {
                    results.push({
                      cfi: found[i].cfi,
                      excerpt: (found[i].excerpt || '').trim()
                    });
                  }
                } catch (e) {}
                try { item.unload(); } catch (e) {}
                setTimeout(step, 0);
              })
              .catch(function () {
                try { item.unload(); } catch (e) {}
                setTimeout(step, 0);
              });
          }
          step();
        },
        setTheme: function (t) {
          if (t.bg) theme.bg = t.bg;
          if (t.fg) theme.fg = t.fg;
          if (t.link) theme.link = t.link;
          if (t.fontSizePct) theme.fontSizePct = t.fontSizePct;
          if (t.fontFamily !== undefined) theme.fontFamily = t.fontFamily;
          if (t.lineHeight) theme.lineHeight = t.lineHeight;
          applyTheme();
          if (t.columns) {
            columnsMode = t.columns;
            applyColumns();
          }
          if (t.edgeTaps !== undefined) {
            edgeTapsEnabled = t.edgeTaps === true;
            applyEdgeTaps();
          }
          if (t.pageAnimation) {
            pageAnimation = t.pageAnimation;
            applyPageAnimation();
          }
        }
      };

      rendition.display().then(function () {
        applyTheme();
        applyColumns();
        applyPageAnimation();
        var start = params.get('cfi');
        if (start) rendition.display(start);
        sendToHost({ type: 'ready' });
      });
    })();
  </script>
</body>
</html>
